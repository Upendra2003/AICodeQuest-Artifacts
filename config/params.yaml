# AICodeQuest-Industry tunable parameters.
#
# Every tunable number/setting used anywhere in the codebase MUST live here —
# never hardcode a threshold, limit, weight, or timeout in source. Any new
# knob added here must also be reflected in params.schema.json and recorded
# in CHANGELOG-config.md.
#
# There is no manually-maintained version field in this file. CONFIG_VERSION
# is computed by backend/app/core/config.py as a short sha256 hash of this
# file's canonicalised content, so it changes automatically whenever any
# value below changes and is stable otherwise.

# --- trigger: decides whether a PR diff is large/novel enough to enter the
# comprehension gate at all. ---
trigger:
  # Minimum number of changed lines (insertions + deletions) in a diff before
  # the gate can trigger. Below this, the diff is considered too small to be
  # worth gating. Sensible range: 20-300 depending on how noisy small PRs are
  # in the target repos.
  min_lines_changed: 50

  # Minimum number of distinct modules/files touched before the gate can
  # trigger. Sensible range: 1-10.
  min_modules_changed: 3

  # AST/text similarity score (0.0-1.0) above which a changed function is
  # considered "basically the same as before" and is skipped from gating,
  # even if the surrounding diff is large (e.g. pure reformatting). Sensible
  # range: 0.80-0.98; higher = more conservative (skips less).
  similarity_skip_threshold: 0.90

  # How many leading directory components of a file path form its
  # module_key for the "distinct modules changed" trigger rule, e.g. depth 2
  # groups "src/api/routes.py" and "src/api/models.py" into "src/api".
  # Sensible range: 1-4; deeper = more modules counted for the same tree.
  module_grouping_depth: 2

  # Glob patterns (matched against the file path) for files excluded
  # entirely from effective-lines/module counting: lockfiles, vendored or
  # build output, minified bundles, etc. Extend as new noisy patterns show
  # up in real repos.
  ignore_globs:
    - "**/*.lock"
    - "**/package-lock.json"
    - "**/yarn.lock"
    - "**/pnpm-lock.yaml"
    - "**/Pipfile.lock"
    - "**/poetry.lock"
    - "**/*.min.js"
    - "**/*.min.css"
    - "**/dist/**"
    - "**/build/**"
    - "**/vendor/**"
    - "**/node_modules/**"

  # Substrings searched for (case-sensitive) in the first
  # generated_marker_scan_lines lines of a file's new content; a match marks
  # the whole file "generated" and excludes it like ignore_globs does.
  generated_file_markers:
    - "@generated"
    - "Code generated by"
    - "DO NOT EDIT"
    - "This file is automatically generated"

  # How many leading lines of a file's new content to scan for
  # generated_file_markers. Sensible range: 5-50; generated-file banners are
  # almost always at the very top of the file.
  generated_marker_scan_lines: 20

# --- developer_gate: the individual-contributor Defense/Attack comprehension
# game shown before a PR with AI-generated code can be merged. NOTE: earlier
# phases (0/1) assumed this would be quiz-based ("questions", "quiz_tier") --
# Phase 5's locked design is Defense/Attack turns with a scaffolded replay,
# NOT a quiz. pass_threshold_pct/levels/round1/round2.questions_per_level
# below are reused as-is (they still mean the right thing: how many
# Defense+Attack turn pairs per level per round). max_quiz_tiers is
# superseded by max_replays below and is no longer read by
# backend/app/services/dev_gate.py -- kept rather than deleted since
# backend/app/db/models.py's DevAttemptDocument.quiz_tier field still
# references the old concept; see reports/phase-5-review.md open questions. ---
developer_gate:
  # Minimum percentage of turns a developer must win to pass the gate.
  # Sensible range: 60-90.
  #
  # Lowered 80 -> 60 in Phase 29 at the study lead's request. Grounding
  # from real play: across the two study accounts, 90 turns were won out
  # of 207 graded (44% and 40%), so an 80% bar cleared almost nobody and
  # sent participants round the replay loop instead of through the gate.
  # 60% of 8 round-1 turns is 5, which is comfortably above chance for a
  # find-the-bug task while still requiring more right than wrong.
  # 60 -> 50 on 2026-09-10, set by the study lead for the 40-participant
  # developer study: with four Defense turns, 50% means catching 2 of 4
  # bugs clears the gate. It was 60 (-> 3 of 4, i.e. 75%) only because
  # Phase 43 cut the round from 8 turns to 4 without retuning this.
  # PROVISIONAL: to be re-decided after a pilot pass and FROZEN before
  # the main run -- changing it mid-study changes what "cleared" means
  # across participants. No RQ reads pass/fail; they use the continuous
  # score, so this governs the participant's experience, not the analysis.
  # WHAT THIS IS APPLIED TO, made explicit on 2026-09-25 because it briefly
  # was not: **bug detection accuracy alone** -- won Defense turns over
  # graded Defense turns. Attack does NOT enter the gate score. At 50% over
  # four Defense turns this means catching 2 of 4 planted bugs.
  #
  # Attack is optional at every turn and must stay optional in the sense
  # that matters: declining to attack can never stop somebody raising a pull
  # request. The pressure to play Attack lives on the LEADERBOARD instead
  # (leaderboard.score_weights), where the only thing at stake is rank.
  pass_threshold_pct: 50

  # Minimum number of branch/loop/call/operator nodes a function must
  # contain to be used as a turn target (extraction.can_host_a_bug).
  #
  # 1 means "must do SOMETHING beyond moving values around". A pure
  # accessor -- `int getId() const { return id; }` -- scores 0, and there
  # is nothing in it for any of the 40 bug_bank operators to act on: no
  # boundary to shift, no condition to flip, no guard to drop.
  #
  # Reported from real play (2026-08-17) on a C++ inventory program: the
  # pull request had 24 extracted functions, but the eight sitting
  # immediately after the diff slice were all three-line Product
  # getters/setters -- and round 1 is exactly eight turns, so every turn
  # drew an accessor while addStock/removeStock/findProduct/statistics
  # were never reached. Raise this to demand more substantial functions;
  # if it filters out EVERYTHING the unfiltered pool is used instead,
  # because a stand-in exercise is worse than a thin one.
  min_function_logic_nodes: 1

  # The perturbation/comprehension difficulty levels the game draws from, in
  # increasing difficulty. Must match the levels implemented in
  # backend/app/services/perturbation.py.
  levels: [A1, A2, A3, A4]

  round1:
    # Defense turns per level. Four levels x 1 = the four Defense turns a
    # gate opens with.
    #
    # 2 -> 1 on 2026-09-09 at the study lead's direction: "reduce the bug
    # finding to only 4 questions for defense instead of 8, that will
    # reduce the time to play and may keep playing more games". A shorter
    # round that gets finished is worth more than a longer one that gets
    # abandoned, and every measure here is per-turn, so more short sessions
    # is MORE data rather than less.
    #
    # TWO CONSEQUENCES, both real and neither silent:
    #
    #  1. THE PASS THRESHOLD GETS COARSER. `pass_threshold_pct` is 60, and
    #     60% of 4 is 2.4 -- so clearing needs 3 of 4 (75%) where it used to
    #     need 5 of 8 (62.5%). The gate is HARDER now, not easier, which is
    #     the opposite of the intent behind shortening it. Flagged for the
    #     study lead rather than silently retuned, because the threshold is
    #     a study parameter and moving it changes what "cleared" means
    #     across every session already recorded.
    #  2. FEWER COMPREHENSION QUESTIONS ARE POSSIBLE. An MCQ needs a
    #     function whose Defense turn produced an executable suite, so four
    #     turns can yield at most four distinct functions against
    #     `mcq.questions_per_gate: 5`. Not fatal -- Phase 36 part 8 widened
    #     the candidate pool across replays, so earlier rounds still
    #     contribute -- but a FIRST round can now run short by construction,
    #     and the phase ends cleanly when it does rather than stalling.
    questions_per_level: 1

    # Attack turns per level, set separately from Defense as of Phase 34
    # part 3. Four levels x 1 = four Attack turns.
    #
    # Deliberately fewer than Defense, at the study lead's direction: the
    # Attack phase tests whether a developer can PLANT a bug an AI cannot
    # repair, which is a hypothesis-forming measure rather than the gate's
    # primary one, and four turns is enough to form it. Defense carries the
    # comprehension claim and keeps its eight. Attack turns remain optional
    # to play (skipping costs nothing), so this caps a phase a participant
    # may skip through anyway.
    attack_questions_per_level: 1

  # `round2` was REMOVED in Phase 34. The gate is one round of eight turns;
  # failing it goes straight to REPLAY (fresh perturbations, up to
  # max_replays) and then ESCALATED, exactly as failing round 2 used to.
  # What is gone is the scaffolded second round in between.
  #
  # The reason is measurement, not simplification. A round-2 turn was played
  # AFTER a recap that named the bug class, so its turns are not exchangeable
  # with round-1 turns -- pooling them into one accuracy mixes assisted with
  # unassisted performance, which is the same category of error as pooling
  # the two grading regimes (Phase 33). Comprehension is now measured once,
  # unassisted, over eight turns.
  #
  # WHAT THIS GIVES UP, on purpose: round 2 was the only remediation step in
  # the tool -- the one place a participant was told what they had missed.
  # Any claim that the gate IMPROVES comprehension (rather than measuring it)
  # is weaker without it. See docs/STUDY-PROTOCOL.md.

  # Superseded by max_replays (see below) for Phase 5's actual dev_gate.py
  # logic; kept for backward compatibility with DevAttemptDocument.quiz_tier.
  max_quiz_tiers: 2

  # Hard cap on full replays (fresh perturbations, back to ROUND1_DEFENSE)
  # after failing the round, before the gate ESCALATES to researcher review
  # instead of re-playing forever. Sensible range: 1-5. Exceeding this NEVER
  # locks the participant out of raising a PR -- it flags for review and
  # allows a logged manual override.
  max_replays: 2


  # Whether the participant may abandon an in-progress (or finished)
  # playthrough and start the gate over from turn 1, via
  # POST /dev-gate/<pr_id>/restart and the panel's "Start over" button.
  #
  # On by default because without it there is NO route back to the
  # beginning: the whole session lives in Mongo, so reopening the panel,
  # hard-refreshing the page and re-tagging the diff all resume exactly
  # where the participant left off.
  #
  # Set false for a study arm that must not let participants reroll --
  # note the restart deliberately does NOT clear
  # used_perturbation_signatures, so a restarted round draws fresh
  # perturbations rather than replaying ones whose answers are known.
  # There is no cap on how many times a participant may restart; see the
  # open question in reports/phase-22-review.md.
  manual_restart_enabled: true

# --- lead_gate: the tech-lead/reviewer NFR (non-functional requirement)
# comprehension check for a PR.
#
# Phase 30 replaced this gate's original design (a free-text answer scored
# by an LLM against a generated rubric) with a MULTIPLE-CHOICE question per
# selected NFR, plus an optional human-verification form in which the lead
# rates whether the generated question and its marked-correct option were
# actually valid. The reason is the one the study lead raised: nothing
# established that LLM-as-judge scoring of a paragraph was correct, and a
# free-text score has no ground truth to check it against. An MCQ has a
# single committed answer key, and the lead's verification gives every item
# a HUMAN judgement of its validity -- so the study can report how often
# the generator produced a sound question rather than assuming it did.
# See reports/phase-30-review.md.
lead_gate:
  # Minimum percentage of NFR questions a lead must answer correctly to pass
  # the gate. Sensible range: 50-90.
  #
  # 60 (not the pre-Phase-30 value of 80, which was set for continuous
  # rubric scores): scoring is now per-question all-or-nothing, so with the
  # usual 3-5 NFRs an 80% bar is effectively "miss none". Random guessing
  # over `options_per_question` = 4 scores 25%, so 60% is still a real bar.
  # Mirrors the developer gate's own measured 80 -> 60 move in Phase 29.
  pass_threshold_pct: 60

  # Number of questions generated per selected NFR. Sensible range: 1-3.
  questions_per_nfr: 1

  # How many options each generated question offers, exactly one of which
  # is correct. Sensible range: 3-5. Changing this changes the guessing
  # baseline (1/n), so it is a study-design decision, not a UI preference.
  options_per_question: 4

  # How scores across multiple NFRs are combined. Only "equal" (unweighted
  # mean across every answered question) is implemented.
  nfr_weighting: equal

  # NFR categories offered for selection when no explicit set is chosen for
  # a PR. Must match the categories implemented in backend/app/services/nfr.py.
  default_nfrs: [security, maintainability, usability, performance, reliability]

  # Max regeneration attempts for a generated question that fails QC --
  # either the diff-groundedness check (must name >= 1 identifier from the
  # diff) or the structural/self-consistency checks below. Sensible range:
  # 1-5. Exhausting this does NOT stall the lead: the last candidate is
  # served with qc_passed=false recorded, because the human verification
  # step is now the backstop for exactly this case.
  max_question_regen_attempts: 3

  # Hard cap on full retries (fresh questions, back to IN_PROGRESS) after
  # failing the gate, before it ESCALATES to researcher review instead of
  # retrying forever -- mirrors developer_gate.max_replays. Exceeding this
  # NEVER locks the lead out; it flags for review and allows a logged
  # manual override. Sensible range: 1-5.
  max_retries: 2

  # How many times the model is re-asked to answer its OWN generated
  # question, cold (fresh prompt, no answer key shown), before the item is
  # accepted. All k must reproduce the committed answer_index. Same
  # mechanism as quizgen.self_consistency_k, applied to NFR questions.
  # Sensible range: 1-5.
  self_consistency_k: 3

  # Temperature for those self-consistency re-asks. 0.0 is maximally
  # deterministic; kept as a knob per standing rule 2. Range: 0.0-0.3.
  self_consistency_temperature: 0.0

  # Reject a generated item whose longest option is more than this many
  # times its shortest -- a conspicuously longer option is a giveaway
  # independent of comprehension. Sensible range: 2.0-4.0.
  max_option_length_ratio: 3.0

  # --- human verification of the generated item (Phase 30) ---
  # REMOVED 2026-08-31: the `verification` block (`enabled`, `required`,
  # `on_invalid_flag`). It configured a second step after each answer, in
  # which the lead said whether the question they had just answered -- and
  # the option marked correct on it -- were valid.
  #
  # Removed at the study lead's direction, for the same reason as
  # `lead_review`'s rating step: judging a generated item is researcher
  # work, done afterwards over the stored questions, and asking a
  # participant to answer an item and grade the item in one sitting made
  # the gate longer and put two tasks in one screen.
  #
  # What this gives up, on purpose: the lead was the only in-product human
  # check on LLM-generated NFR items, and `nfr.py`'s QC gate is now the
  # only thing standing between a bad item and a participant. Phase 30
  # measured that gate rejecting roughly one item in three as genuinely
  # arguable, and a QC-FAILED item is still served (marked `qc_passed:
  # false`) precisely because a human was expected to be the backstop.
  # See reports/phase-40-review.md.

# --- execution: sandboxed code execution (Judge0 in Phase 3, Piston as of
# Phase 28). Both clients are kept; `backend` selects which one runs. ---
execution:
  # Which sandbox actually executes submissions: "piston" or "judge0".
  #
  # Phase 28 moved the default to Piston for one measured reason: Judge0
  # 1.13.1's isolate REQUIRES cgroup v1, and every host this project has
  # run on is cgroup v2-only, so Judge0 has never executed a single
  # submission here (judge0/judge0#554, reports/phase-3-review.md).
  # Piston's own install requirements are the exact inverse -- "cgroup v2
  # enabled, and cgroup v1 disabled" -- so it starts and runs here.
  # Judge0's client is NOT deleted: it is tested code, and a cgroup
  # v1-capable production host could still prefer it.
  backend: "piston"

  # Base URL of the Piston instance (self-hosted -- the public
  # emkc.org API became whitelist-only on 2026-02-15 and explicitly
  # excludes university/research projects, and sending participant code
  # to a third party would break docs/DATA-FLOW.md's guarantee that no
  # participant code leaves self-hosted infrastructure).
  piston_url: "http://localhost:2000"

  # Our language key -> the name and version Piston itself uses. BOTH are
  # required, and they are not interchangeable:
  #   * the name differs from ours ("c++", not "cpp"; the runtime that
  #     serves our "javascript" is installed as the package "node"), and
  #     passing the wrong one is a 400 from Piston, not a fallback;
  #   * the version is pinned, never a SemVer range, because a suite's
  #     golden values are only reproducible against the same runtime that
  #     produced them.
  # `install` is the PACKAGE name (what infra/piston/install_runtimes.py
  # POSTs); `name` is the RUNTIME name (what /execute expects). They
  # differ for node/javascript and gcc/c/c++ -- one gcc package installs
  # c, c++, d and fortran runtimes.
  piston_languages:
    python:     {install: "python", name: "python",     version: "3.12.0"}
    javascript: {install: "node",   name: "javascript", version: "20.11.1"}
    c:          {install: "gcc",    name: "c",          version: "10.2.0"}
    cpp:        {install: "gcc",    name: "c++",        version: "10.2.0"}
    java:       {install: "java",   name: "java",       version: "15.0.2"}
    rust:       {install: "rust",   name: "rust",       version: "1.68.2"}

  # Max bytes Piston keeps per stdio buffer (PISTON_OUTPUT_MAX_SIZE).
  # Piston's own default is 1024 bytes, which is far too small for us:
  # a 3-case suite prints an AICQ_RESULT line per case carrying both the
  # actual and expected value, and a truncated buffer comes back as
  # status "OL" with the results silently cut off -- grading would fail
  # for reasons having nothing to do with the participant's code.
  # Measured: a fork bomb's stderr hit the 1024-byte cap immediately.
  # Sensible range: 16384-262144.
  piston_output_max_bytes: 65536

  # Base URL of the Judge0 instance (only used when backend == "judge0").
  judge0_url: "http://localhost:2358"

  # Substrings matched against Judge0's live GET /languages `name` field to
  # resolve each of our 4 supported languages to a language_id at boot.
  # When more than one language matches (e.g. multiple GCC versions),
  # execution.py picks the one with the highest version number embedded in
  # the name. Never hardcode a language_id in source — if Judge0 has no
  # match, resolution fails loudly (LanguageMissingError) instead of
  # guessing.
  language_name_patterns:
    python: "Python (3"
    javascript: "JavaScript (Node.js"
    java: "Java (OpenJDK"
    c: "C (GCC"

  # Max CPU time (seconds) Judge0 allows a single submission to consume.
  # Sensible range: 1-15.
  cpu_time_limit_sec: 5

  # Max memory (KB) Judge0 allows a single submission to consume. Sensible
  # range: 65536-262144 (64MB-256MB).
  memory_limit_kb: 131072

  # Max wall-clock time (seconds) Judge0 waits for a submission to finish
  # before killing it, independent of CPU time. Sensible range: 2-30.
  wall_clock_timeout_sec: 10

  # Whether submitted code is allowed network access inside the Judge0
  # sandbox. Should stay false for untrusted/generated code. Judge0 is also
  # configured with ALLOW_ENABLE_NETWORK=false (see infra/judge0), so a
  # submission cannot override this even if it tried.
  enable_network: false

  # Max number of processes/threads a single submission may create
  # (Judge0's MAX_PROCESSES_AND_OR_THREADS). Contains fork bombs. Sensible
  # range: 10-120.
  max_processes_and_threads: 60

  # How often (seconds) execution.py polls GET /submissions/{token} while
  # waiting for a result. wait=true is never used in production paths (it
  # blocks a Judge0 worker for the whole run). Sensible range: 0.2-2.
  poll_interval_sec: 0.5

  # Extra seconds beyond wall_clock_timeout_sec that the poller keeps
  # checking before giving up and reporting infra_error (Judge0 itself
  # should have already killed the submission by wall_clock_timeout_sec;
  # this buffer only covers Judge0's own processing/queue delay). Sensible
  # range: 5-30.
  poll_timeout_buffer_sec: 10

  # How many times to retry a submission that came back as our own
  # infra_error verdict (Judge0 unreachable, malformed response, etc.).
  # Never retries a legitimate 'failed' verdict. Sensible range: 0-5.
  max_infra_error_retries: 3

  # Base backoff (seconds) between infra_error retries. Sensible range:
  # 0.5-5.
  infra_error_retry_backoff_sec: 1.0

# --- languages: what the gate can do with each language (Phase 28).
#
# This replaces diff_scope.py's hardcoded EXTENSION_LANGUAGE_MAP, which
# had drifted into being a tunable in source (rule 2). Adding a language
# is now a config change plus, for an executable one, a tree-sitter node
# type in extraction.py.
#
# `grading` is the important field:
#   "tests"   -- generate a test suite and RUN the participant's fix
#                against it (services/testgen.py + the Piston runner).
#   "compare" -- no execution is possible or meaningful, so grade by
#                comparing the fix to the original function
#                (services/grading.py, the Phase 19 judge). HTML and CSS
#                are not executable in any sense a unit test could
#                assert on, so they take this path by design, not as a
#                degradation.
#
# A language whose `grading` is "tests" can still FALL BACK to "compare"
# at runtime when no valid suite survives validation -- see
# testgen.max_suite_attempts. "compare" here means it never even tries.
languages:
  python:
    extensions: [".py"]
    grading: "tests"
    # tree-sitter grammar name (tree_sitter_language_pack.get_parser).
    grammar: "python"
  javascript:
    extensions: [".js", ".jsx", ".mjs", ".cjs"]
    grading: "tests"
    grammar: "javascript"
  # TypeScript (Phase 36). Reported by a tester as "unsupported language" --
  # and Phase 33 had already recorded why that was worse than it sounds:
  # `evaluate_trigger` counts lines regardless of language, so a 120-line
  # .tsx pull request FIRED the gate, disabled Create/Merge, and then had
  # nothing to play.
  #
  # ONE grammar for both extensions, verified rather than assumed: the
  # `tsx` grammar parses plain .ts AND .tsx-with-JSX without error, while
  # the `typescript` grammar errors on JSX. Since a language key maps to a
  # single grammar, `tsx` is the one that covers the whole language.
  #
  # grading: "compare", NOT "tests" -- and this is a fact about the sandbox,
  # not a preference. Piston has no TypeScript runtime installed (verified:
  # c, c++, d, fortran, java, javascript, python, rust), so nothing could
  # execute a suite even if one were generated. Comparison grading is the
  # designed bottom rung (Phase 19) and is what React-shaped JavaScript
  # already uses. Change this to "tests" only after adding a typescript
  # entry to `execution.piston_languages` AND installing that runtime.
  typescript:
    extensions: [".ts", ".tsx", ".mts", ".cts"]
    grading: "compare"
    grammar: "tsx"
  java:
    extensions: [".java"]
    grading: "tests"
    grammar: "java"
  c:
    extensions: [".c", ".h"]
    grading: "tests"
    grammar: "c"
  cpp:
    extensions: [".cpp", ".cc", ".cxx", ".hpp", ".hh"]
    grading: "tests"
    grammar: "cpp"
  rust:
    extensions: [".rs"]
    grading: "tests"
    grammar: "rust"
  html:
    extensions: [".html", ".htm"]
    grading: "compare"
    grammar: "html"
  css:
    extensions: [".css"]
    grading: "compare"
    grammar: "css"

# --- llm: the provider-agnostic LLM client used for question/test/
# perturbation generation. ---
llm:
  # Name of the LLM provider backing backend/app/services/llm.py.
  # Switched from the Phase 0 placeholder "groq" (never implemented or
  # tested — no API key was available) to "ollama" in Phase 4: a local
  # Ollama server with several models (including qwen2.5:7b-instruct) was
  # found running in the dev environment, letting the client be built and
  # verified against a real, live model instead of staying an untested
  # assumption. Provider-specific request/response handling lives in
  # backend/app/services/llm.py.
  provider: ollama

  # Base URL of the Ollama server (follows the same pattern as
  # execution.judge0_url).
  ollama_base_url: "http://localhost:11434"

  # Model identifier passed to the provider's API. qwen2.5:7b-instruct was
  # confirmed available on the local Ollama server.
  model: qwen2.5:7b-instruct

  # Sampling temperature. Sensible range: 0.0-1.0 (lower = more
  # deterministic; useful for generating checkable quiz answers).
  temperature: 0.2

  # Maximum tokens requested per completion. Sensible range: 256-4096
  # depending on how large generated quizzes/harnesses are.
  max_tokens: 1024

  # Seconds to wait for an LLM response before treating the call as failed.
  # Local models can be slow on cold load (observed 10+ seconds for a
  # trivial prompt after a model swap) — kept generous. Sensible range:
  # 5-120.
  timeout_sec: 60

  # Per-model overrides for timeout_sec. A big local model is not slow in
  # the way a hung request is slow, and one global timeout cannot tell them
  # apart: measured on this machine, qwen3:32b takes 66-90s for a test-suite
  # generation that qwen2.5:7b does in 3-30s, so the 60s default recorded
  # it as `llm_error: ReadTimeout` and threw away a GOOD answer that was
  # still being written. Raising the global timeout instead would mean a
  # genuinely hung fast-model call also blocks for minutes.
  timeouts_by_model:
    "qwen3:32b": 300

  # Models that emit REASONING tokens in a separate `thinking` field, for
  # which Ollama's `think: false` is sent to turn that off.
  #
  # This is not a style preference, it is a correctness fix. Ollama returns
  # thinking separately from `message.content`, but the tokens still count
  # against `max_tokens` (num_predict). Measured on qwen3:32b: a trivial
  # prompt produced 1098 thinking chars and 31 content chars; the real
  # test-suite prompt spent the WHOLE 1024-token budget reasoning and came
  # back with content EMPTY -- which reached suitegen as
  # `bad_format: parsed 0 of 3 cases` and looked for all the world like a
  # formatting problem. With think:false the same prompt returns 590 chars
  # of complete, correctly formatted answer in FEWER tokens (209 vs 452).
  #
  # Add a model here when its replies come back empty or truncated and
  # `/api/chat` shows a populated `thinking` field.
  disable_thinking_for:
    - "qwen3:32b"

  # Model used for the Attack-phase AI opponent — deliberately a separate
  # key from `model` (the generator model) so the opponent can be rotated
  # or blinded independently, per the leaderboard construct-validity
  # concern (a participant shouldn't be able to infer/game a fixed
  # opponent identity). Set to a different model family (Mistral vs.
  # Qwen) than the generator, also confirmed available on the local
  # Ollama server.
  opponent_model: mistral:latest

  # Model used for a SECOND attempt at work the cheap `model` failed at --
  # currently only test-suite generation, after
  # testgen.escalate_after_attempts (Phase 28). Cheap-first-then-escalate,
  # the same shape as Phase 6's fallback ladder, because the validation
  # gate makes a bad suite cheap to DETECT: two sandbox runs, milliseconds.
  #
  # Measured on one real function, generating a whole self-contained test
  # program: qwen2.5:7b 5-9s (syntax errors), glm-4.7-flash 42s, qwen3:32b
  # 193s. That measurement is why generation does NOT ask for a whole
  # program any more -- but it is also why escalation targets glm rather
  # than the 32b: three minutes does not fit a prefetch window.
  # Used for the LAST test-suite attempts (testgen.escalate_after_attempts).
  #
  # Was glm-4.7-flash:latest. Changed on measured evidence, not preference:
  # across a real-model benchmark, glm-4.7-flash produced UNPARSEABLE output
  # (`bad_format`) on 11 of its attempts -- so the final attempt, the last
  # chance a turn has at a suite, was being spent on the model least able to
  # follow the response format. qwen2.5:7b, the fast default, produced zero
  # bad_format in the same runs.
  #
  # qwen3:32b measured 3/4 suites against qwen2.5:7b's 2/4 on the same four
  # functions, at 88s average against 25s. That trade is right HERE and only
  # here: escalation fires on the last attempt only, and suite generation is
  # permanently off the participant's critical path (prefetch worker). It
  # needs llm.timeouts_by_model above -- at the 60s default it scored 1/4,
  # because its good answers were being cut off mid-write.
  escalation_model: qwen3:32b

  # How many times a structured (JSON-mode) call retries, with the
  # validation error appended to the prompt, before failing loudly.
  # Sensible range: 0-2; the phase brief calls for exactly one retry.
  json_validation_max_retries: 1

  # How many times a CODE response (a fenced perturbation or opponent fix,
  # see LLMClient.generate_code_response) may be re-sampled when the model
  # returns something that does not parse in the target language.
  #
  # Separate from json_validation_max_retries because the trade-off is
  # different: an attempt costs ~1.4s (Phase 24), and what the extra try
  # buys is the difference between a participant seeing THEIR OWN code and
  # being handed a generic stand-in exercise. Observed against a real
  # Flask handler where the model produced invalid Python twice running.
  # Sensible range: 1-5.
  code_response_max_retries: 4

  # How long Ollama keeps the model resident in VRAM after a request,
  # passed straight through as the API's `keep_alive` field (a duration
  # string, e.g. "30m", or "-1" to never unload).
  #
  # Ollama's own default is 5 minutes, which is shorter than a participant
  # takes to read one turn -- `/api/ps` was reporting no resident model at
  # all on the study machine, so each turn paid a cold load (measured on
  # the L40: 2.5s cold vs 0.3s warm). Sensible range: "5m"-"60m"; "-1"
  # pins the model permanently, which is reasonable on a dedicated study
  # machine but rude on a shared one.
  keep_alive: "30m"

# --- perturbation: A1-A4 injection (perturbation.py). ---
perturbation:
  # Max attempts (template retries, then LLM fallback attempts) to find a
  # perturbation that actually breaks >=1 verification test case before
  # giving up and marking the function un-perturbable at that level.
  # Sensible range: 1-5.
  max_regen_attempts: 3

  # --- Phase 28: bug RELIABILITY. Both knobs below exist because of two
  # things reported from real play: "sometimes the LLM is not reliably
  # generating bugs / sometimes there is no bug at all", and an A1 turn
  # that served a deleted-dict-field bug (an A3 in this study's taxonomy).
  # Under Phase 22's verify=False the only checks were "does it parse" and
  # "is it new", so neither could be caught. ---

  # How many times to regenerate a perturbation whose injected "bug" turns
  # out to change NO OBSERVABLE BEHAVIOUR, before giving up on this
  # function and moving to the next one in the pull request's pool.
  #
  # Proof comes from the generated suite: a suite that passes on the
  # original AND passes on the perturbed code has demonstrated the two are
  # behaviourally identical. That is not a bad suite -- it is evidence
  # there is no bug to find. Only applies when a suite could be built at
  # all (see the `languages` table); a comparison-graded language cannot
  # prove this either way. Sensible range: 1-4; each attempt costs one
  # perturbation plus one suite generation.
  max_bug_verification_attempts: 3

  # Reject model-generated bugs whose EDIT SHAPE does not match the level
  # asked for -- e.g. an A1 (boundary/off-by-one, an in-place expression
  # edit) that actually deleted a whole statement, which is an A3. Levels
  # are this study's independent variable, so a turn labelled A1 carrying
  # an A3 bug corrupts the measure rather than merely reading oddly.
  #
  # Shape-based and deliberately conservative: it rejects the clearly wrong
  # KIND of edit, and does not try to judge whether the bug is a good one.
  # Templates are exempt (they are the level by construction). If the
  # regeneration budget runs out the candidate is served anyway, with the
  # mismatch logged -- a mislabelled turn beats no turn.
  #
  # Corrected 2026-08-30: this check never verified the LEVEL, only the
  # diff shape, and its rejections are now logged as `perturbation_no_op`
  # and `perturbation_shape_mismatch` so the distinction is visible.
  enforce_level_shape: true

  # The real level check (2026-08-30), separate from the shape check above
  # because they answer different questions. Shape asks "is this the right
  # KIND of edit for the operator"; this asks "does the bug READ as the
  # level we are about to label it".
  #
  # Why it was needed, measured: `operator_shape_matches` accepts a
  # `modified` edit against every expectation, and 37 of 40 operators expect
  # `modified` -- so 13 of 16 (requested level x actual level) combinations
  # were accepted. Across 325 live rejections, ZERO were cross-level.
  #
  # It classifies from the CHANGED TOKENS (an operator swapped within one
  # class -> A2; a numeric bound moved by one -> A1; a name that did not
  # exist in the original -> A4) and reports a level only when exactly one
  # matches. Deletions abstain, because a removed statement is genuinely
  # ambiguous between A1's `missing_return` and A3's `missing_edge_case`.
  # Set false to restore pre-2026-08-30 behaviour.
  enforce_level_classifier: true

  # Accept an LLM-injected bug that could NOT be execution-verified, rather
  # than failing the turn.
  #
  # Verification requires building a runnable harness for the function. That
  # is impossible for large classes of real code -- void functions, functions
  # driven by stdin/stdout, functions depending on file-level context
  # (structs, globals, includes) that the harness builder does not carry.
  # Before this flag, such a function produced VerificationUnavailableError,
  # live generation failed, and the participant was served an unrelated
  # Python substitute exercise instead of their own code (see
  # reports/phase-18-review.md).
  #
  # With this true, the perturbation is served unverified and the turn is
  # graded by comparing the submitted fix against the KNOWN original (see
  # `grading` below) rather than by executing tests. We injected the bug, so
  # the correct answer is already known -- execution is one way to check the
  # fix, not the only one.
  #
  # Set false to restore the strict Phase 4 behaviour (only ever serve
  # execution-verified perturbations, fail the turn otherwise).
  accept_unverified_when_execution_unavailable: true

# --- grading: how a submitted fix is judged (grading.py). ---
grading:
  # NOTE: there is deliberately NO similarity threshold here. An injected
  # bug is one or two tokens, so in a 20-line function the BUGGY version is
  # ~99% similar to the original -- any threshold loose enough to tolerate
  # reformatting also passes a submission that changed nothing. Measured:
  # `count++` -> `count--` scores 0.9921. Grading is exact-normalized-match
  # or LLM judge; see services/grading.py.

  # Ask the LLM whether a fix that is NOT structurally identical is
  # nonetheless semantically equivalent to the original. Catches a developer
  # who fixed the bug a different but correct way (`x < n + 1` for `x <= n`),
  # which a pure similarity check would wrongly fail.
  llm_judge_enabled: true

  # Temperature for that judgement. 0 -- this is a classification, and it
  # decides whether a participant passes.
  llm_judge_temperature: 0.0

# --- mcq: the input/output comprehension question attached to each Defense
# turn (Phase 34).
#
# WHY THIS EXISTS. The gate's own score is a repair task, and until now it was
# the only comprehension measure in the system -- which makes any claim that
# the gate measures comprehension circular. This adds a SECOND, differently
# shaped measure over the same function: predict what the code returns for an
# input the participant has not been shown.
#
# That shape is not arbitrary. Arvan et al. (ASE 2026) evaluated 14
# comprehension proxies against an expert-consensus ground truth and found
# input/output question proxies the MOST reliable and syntax-focused questions
# the LEAST. See docs/STUDY-PROTOCOL.md for the full metric review.
#
# THE ANSWER KEY IS NEVER AUTHORED BY THE MODEL. It comes from EXECUTING the
# original function on the chosen input -- the same rule Phase 28 built the
# suite pipeline on ("never ask the model for an expected value"), for the same
# reason: a model-authored key can be wrong, an executed one cannot. The model
# writes only the call expression and the three DISTRACTORS, where being wrong
# is the point.
#
# CONSEQUENCE, stated plainly: an MCQ exists only where an executable suite
# exists. On the functions Phase 33 rules out (React handlers closing over
# component state, JSX bodies) there is NO question rather than a model-keyed
# one. That is deliberate, and it means the measure is missing on exactly the
# code that is hardest to comprehend -- a biased missingness any analysis must
# report rather than ignore.
mcq:
  enabled: true

  # How many comprehension questions the gate asks, as its OWN phase after
  # Defense and Attack. Phase 34 part 3 moved these out of the individual
  # turns: they are now a separate stage a participant works through before
  # the gate can clear, so the measure is taken once, in one state, rather
  # than interleaved with repair work.
  #
  # Every question must be ANSWERED to clear the gate; none of them is
  # SCORED. Answering is what makes the data point exist (nothing forced it
  # when the question sat beside the editor); not scoring is what stops it
  # becoming something to game rather than answer.
  #
  # NOTE the measurement cost of 5: five dichotomous items put a single
  # participant's score at roughly +/-22 percentage points of standard error
  # (at ~60% accuracy), which attenuates every correlation this measure
  # exists to support. Aggregate claims across participants survive that;
  # per-individual claims do not, and need either more items or an explicit
  # attenuation correction. Raising this raises the reviewing lead's
  # workload one-for-one.
  #
  # If fewer than this many can be generated (no executable suite exists for
  # enough of the pull request's functions), the gate asks however many it
  # has and clears on those. A participant is never trapped by a question
  # that could not be built.
  questions_per_gate: 5

  # Options shown, including the one correct answer. 4 gives 25% chance
  # performance, the standard 4-option MCQ.
  options_per_question: 4

  # Attempts at generating a usable item before serving the turn with no
  # question at all. A turn without an MCQ is a missing data point, never a
  # blocked participant.
  max_attempts: 2

  # Reject an item whose options differ wildly in length: a conspicuously
  # longer option is a giveaway independent of understanding, the classic MCQ
  # construction flaw. Ratio of longest option to shortest.
  max_option_length_ratio: 3.0

  # --- the LLM as a THIRD RATER (Phase 35) ---
  #
  # After an item is built, the model is asked to ANSWER it cold -- shown the
  # function, the call and the four shuffled options, and never the key. Its
  # choice is stored beside the developer's and the lead's, so all three are
  # scored against the same executed gold standard.
  #
  # Two things this buys, both of which the study needs:
  #   * a third rater, which is what makes Fleiss' kappa (>=3 raters) the
  #     right agreement statistic rather than pairwise Cohen's;
  #   * a generator sanity check -- a model that cannot solve what it just
  #     wrote has probably written a bad item, and that is now a NUMBER
  #     rather than an impression.
  #
  # It is answered by the SAME model that generated it, deliberately: that is
  # the strictest form of the check (a different model failing could mean the
  # item is hard OR that the two models differ). Phase 30 used the same
  # design for NFR self-consistency.
  llm_self_answer:
    enabled: true
    # Independent cold passes. The modal choice is recorded; ties resolve to
    # the FIRST pass, and disagreement across passes is stored as
    # `llm_answer_agreement` (1.0 = every pass agreed) so an unstable answer
    # is visible rather than averaged away.
    passes: 3
    # Non-zero so the passes are genuinely independent; 0.0 would make all
    # three identical and the agreement figure meaningless.
    temperature: 0.3

# --- lead_review: the lead's independent review of a developer's
# comprehension items (Phase 35).
#
# WHY THIS EXISTS. The developer's MCQ answers alone cannot tell us whether
# the ITEM was any good -- a developer who gets it wrong may have misread the
# code, or the question may have been broken. Phase 30 solved the same
# problem for the Lead gate's NFR items by making the lead a human verifier.
# This applies that design to the developer's comprehension items, and adds
# the piece Phase 30 lacked: the lead ANSWERS the item cold first, so their
# choice is a rating-independent expert reference.
#
# THE ORDER IS LOAD-BEARING, and it is Phase 30's rule again: the key is
# revealed only AFTER the lead commits to an answer. Rating a question's
# quality having already seen which option is marked correct is a different
# (and much easier) task than answering it, and the two must not contaminate
# each other. A lead who has answered can then be told the key and asked
# whether it was right.
#
# THE LEAD NEVER SEES THE DEVELOPER'S ANSWER. Not before, not after. It would
# anchor them, and their independence is the entire value of the measure.
lead_review:
  enabled: true

  # How many items a lead is offered per pull request they review. Fewer
  # than this is normal (a gate may have generated fewer questions).
  items_per_pr: 5

  # Fraction of eligible items routed for review, 1.0 = all of them. Below
  # 1.0, selection is DETERMINISTIC on the item id (not random at read
  # time), so the same item is always either in or out of the sample and a
  # reviewer refreshing the queue does not resample.
  sample_fraction: 1.0

  # How many independent leads should review one item. >1 gives a
  # lead-vs-lead agreement figure in addition to the three-way one; it also
  # multiplies reviewer workload, so 1 is the study default and 2 is the
  # setting to raise it to for a reliability subsample.
  reviewers_per_item: 1

  # REMOVED 2026-08-31: `quality_scale` (a 5-point Likert on question
  # quality), `judgements` (question_is_well_formed / key_is_correct) and
  # `allow_skip`. They configured a SECOND step, taken after the lead's cold
  # answer, in which the lead -- now shown the key -- graded the item.
  #
  # Removed at the study lead's direction: judging whether a generated
  # question is any good is RESEARCHER work, done afterwards over the stored
  # items, and asking the person who has just answered an item to also grade
  # it put two different tasks in one screen. A review is now the cold
  # answer and nothing else, which is what services/agreement.py's
  # three-rater kappa actually consumes.
  #
  # What this gives up, on purpose: there is no in-product signal of item
  # quality left, so `mcq_agreement.py`'s quality columns can only report
  # ratings collected before this date. See reports/phase-40-review.md.
  # The stored fields are kept on MCQReviewDocument for exactly that data.

# --- testgen: dynamic test-case generation + validation (testgen.py). ---
testgen:
  # How many candidate test cases to generate per function before
  # validating them against the original (correct) implementation.
  # Raised in Phase 21: participants asked to see the cases they are
  # graded against, and a suite of 3 surviving cases reads as arbitrary.
  # Sensible range: 3-25.
  max_generated_cases: 16

  # Keep asking for more cases (up to perturbation.max_regen_attempts
  # rounds) until at least this many have SURVIVED validation against the
  # original implementation. Generation happens in the background prefetch
  # worker, so the cost is paid off the participant's critical path.
  # Sensible range: 1-20; must be <= max_generated_cases to be reachable
  # in a single round.
  min_surviving_cases: 10

  # Size of the small, deterministic "standard mutants" set (built from
  # perturbation.py's own templates) used to compute a suite's
  # mutation-kill-rate quality metric. Sensible range: 3-10.
  mutation_kill_set_size: 5

  # --- Phase 28 suite pipeline. The two knobs above describe the ORIGINAL
  # (Phase 4) generator, which asked the model for both inputs AND expected
  # outputs. Measured on the local 7b model, that is exactly the thing it
  # is worst at -- it has to mentally execute the function, and it gets it
  # wrong (a generated suite failed on the CORRECT code 1 case in 3). That
  # is why 79 of 110 test_suites in the dev database hold zero cases.
  #
  # The Phase 28 generator never asks for expected values. The model
  # supplies stubs + call inputs only; expected values are produced by
  # EXECUTING the original, correct function, so they are right by
  # construction. Measured acceptance after that change: 10/10 across
  # python and javascript, ~1.4s per generation. ---

  # Test cases per suite. Three, per the study lead's instruction. Every
  # case is shown to the participant (Phase 16's "show them what the
  # system actually did"), so this is also how many they see.
  # Which model generates test suites. null = llm.model (the fast default).
  #
  # Suite generation is the hardest thing asked of a model in this system:
  # it must produce a program that COMPILES out of context AND inputs that
  # actually discriminate a correct function from a buggy one. It is also
  # the one step permanently off the participant's critical path -- suites
  # are generated on the prefetch worker only -- so it can afford a slower,
  # better model than turn generation can.
  #
  # Measured before setting: see reports/phase-31-review.md. Raise to
  # qwen3:32b if the success rate on the fast model is not good enough;
  # the cost is prefetch throughput, not the participant's wait.
  model: null

  # Sensible range: 3-10.
  cases_per_suite: 3

  # How many times to ask for a usable suite before giving up and falling
  # back to the compare-with-original judge (services/grading.py). Each
  # attempt costs one LLM call plus two sandbox runs. Sensible range: 1-5.
  max_suite_attempts: 3

  # After this many failed attempts on the cheap model, escalate to
  # llm.escalation_model for the remaining attempts. Set equal to
  # max_suite_attempts to never escalate. Sensible range: 1-5.
  escalate_after_attempts: 2

  # Reject a suite whose cases all produce the SAME expected value. Such a
  # suite can be perfectly correct and still worthless -- three near-copies
  # of one case. Observed on the local model, which is why this is a gate
  # and not a nice-to-have.
  require_distinct_goldens: true

  # Phase 32: after this many CONSECUTIVE function-intrinsic suite
  # failures (compile/runtime/format -- never `no_discrimination`, which
  # is about the injected bug rather than the function), stop trying to
  # build a suite for that function and grade it by comparison instead.
  # Measured motivation: one function, `statistics`, accounted for 81 of
  # the 170 real-model rejection events in the live database, re-paying
  # the full attempt budget every time the rotation reached it. Keyed by
  # normalised AST fingerprint, so an edited function gets a fresh chance
  # and a success clears the record. 0 disables the mechanism entirely --
  # a wrong verdict here is a silent downgrade to comparison grading, so
  # the study must be able to switch it off. Sensible range: 0 or 2-5.
  suite_infeasible_after: 3

  # Phase 33: decide STATICALLY, before spending any model call or sandbox
  # run, whether a function can support an executable suite at all. The
  # fallback to comparison grading is not new (Phase 28); what was new was
  # discovering incompatibility CHEAPLY instead of by paying the whole
  # attempt budget first.
  #
  # Measured motivation: the study lead's real React pull request
  # (task_react.jsx, 762 lines) failed on all 19 of its functions, at
  # 40-100 SECONDS each, and one participant-visible turn took 63s while
  # the turn before it gave up and served a PYTHON exercise from the static
  # bank. suite_infeasible_after above already stops the SECOND mistake;
  # this stops the first. Three decidable-from-the-syntax-tree reasons
  # cover those failures: the function returns no value (React state
  # setters -- guarantees `identical_goldens`), the body is JSX (Piston's
  # node has no npm packages and runs CommonJS), or it is nested inside
  # another function and closes over its locals (guarantees the
  # `ReferenceError` behind `probe_runtime_error`).
  #
  # Every uncertainty resolves to ELIGIBLE, because a wrong "no" silently
  # and permanently downgrades a function that could have been test-graded,
  # while a wrong "yes" costs one attempt the three-gate validator would
  # have caught anyway. false restores the pre-Phase-33 always-try
  # behaviour.
  suite_eligibility_precheck: true

  # Phase 32: compile the function under test inside ITS OWN FILE (class
  # shell, fields, includes, helpers all present) instead of alone in an
  # empty template. Measured motivation: the baseline bench's compiled-
  # language failures were overwhelmingly compile/runtime errors caused by
  # the missing context (rust 0/6 accepted, every rejection
  # probe_compile_error). Kill switch for the study: false restores the
  # pre-Phase-32 isolated assembly everywhere.
  file_context_enabled: true

  # Max characters of the surrounding file shown to the MODEL in the
  # prompt (the EXECUTED program always uses the whole file -- execution
  # pays no token cost). Above this, a method gets its enclosing class
  # and a free function gets a do-not-redefine name list instead.
  # Sensible range: 4000-30000.
  file_context_max_chars: 12000

# --- quizgen: MCQ generation + QC gate (quizgen.py). ---
quizgen:
  # How many times the model is re-asked to answer its own generated
  # question, cold, before the item is accepted (all k must reproduce the
  # original answer key). Sensible range: 1-5.
  self_consistency_k: 3

  # Temperature used for self-consistency re-asks. The phase brief calls
  # for temperature 0 (maximally deterministic); kept as a knob rather
  # than hardcoded per rule 2. Sensible range: 0.0-0.3.
  self_consistency_temperature: 0.0

# --- auth: JWT session lifetime and password-hashing cost parameters. ---
auth:
  # Minutes an access token stays valid after login.
  #
  # **0 MEANS NEVER EXPIRES** -- app/__init__.py maps it to
  # flask-jwt-extended's `JWT_ACCESS_TOKEN_EXPIRES = False`. Any positive
  # value is a real lifetime in minutes (sensible range 15-1440 if one is
  # ever wanted again).
  #
  # 0 is the study default, set 2026-09-01 at the study lead's direction:
  # A PARTICIPANT SIGNS IN ONCE AND STAYS SIGNED IN.
  #
  # Why, measured rather than assumed. It was 60, and the study host's own
  # telemetry showed what that cost: a participant logged in at 09:36,
  # signed consent successfully at 09:36:08, and at 10:36:33 -- 60m29s
  # later, to the minute -- every call began returning 401. There is NO
  # REFRESH TOKEN anywhere in this backend, so an expiry is a hard stop
  # with no recovery path; they clicked consent 19 times, tried to
  # register a new account 8 times, and reported the tool as broken. An
  # intermediate 480 (8h) was tried first and rejected for the same
  # reason in slower motion: it defers a hard stop rather than removing
  # one.
  #
  # THE TRADE, STATED PLAINLY BECAUSE IT IS PERMANENT: a token that never
  # expires is valid until the participant signs out or the signing key
  # changes. There is no revocation list in this backend, so a leaked
  # token cannot be withdrawn without rotating JWT_SECRET_KEY (which signs
  # everyone out at once). That is acceptable HERE -- a self-hosted
  # research prototype whose tokens grant only that participant's own gate
  # data -- and would not be acceptable in a system holding anything else.
  # Revisit before this design is reused.
  #
  # This does NOT make 401 handling unnecessary and must not be read that
  # way. A token can still be rejected: the database has been dropped
  # before in this project, JWT_SECRET_KEY may be set on the study host,
  # storage can be corrupted. The extension clears a rejected token and
  # says "you have been signed out, sign in again" -- without that, any of
  # those returns to the reported bug, where the popup insists you are
  # signed in while every call fails.
  jwt_access_token_expires_min: 0

  # Argon2id time cost (number of iterations). Higher = slower to hash =
  # more resistant to brute force. Sensible range: 2-10.
  argon2_time_cost: 3

  # Argon2id memory cost in KiB. Higher = more resistant to GPU/ASIC
  # cracking. Sensible range: 19456-262144 (19MB-256MB).
  argon2_memory_cost_kib: 65536

  # Argon2id parallelism (lanes). Sensible range: 1-8, generally matched to
  # available CPU cores on the machine doing the hashing.
  argon2_parallelism: 4

# --- prefetch: background generation of gate content ahead of when a
# developer/lead actually needs it, to hide LLM/Judge0 latency. Phase 0
# wrote this section before the concrete unit of prefetch (a Developer
# gate turn) was known -- lookahead_count/fallback_to_static_bank are
# reused as-is with updated comments; new knobs added in Phase 6. ---
prefetch:
  # Number of upcoming turns (beyond the current one) to prefetch gate
  # content for. 0 disables prefetching.
  #
  # Raised to 2 in Phase 21: generating one real (non-Python) turn measured
  # 27-70s against the local Ollama model, which is longer than a
  # participant spends on the question in front of them, so a single turn
  # of lookahead never caught up.
  #
  # Raised to 7 in Phase 28, which is the WHOLE of round 1's defense turns
  # (4 levels x round1.questions_per_level 2, minus the current one). A turn
  # now costs a perturbation AND a validated test suite -- one LLM call plus
  # two sandbox runs per suite attempt, and up to
  # testgen.max_suite_attempts of them. Generating that two turns ahead
  # leaves no slack for a turn that needs three attempts or escalates to the
  # slower model.
  #
  # There is no risk of running past the round: _maybe_enqueue_prefetch
  # stops at a phase/round boundary because the outcome there is not known
  # yet, so this clamps itself. The cost of over-prefetching is wasted
  # background work for a participant who clears early -- cheap, off the
  # critical path, and idempotent by job_id.
  lookahead_count: 7

  # If prefetching or live generation fails, whether to fall back to a
  # static, pre-approved bank rather than blocking the gate.
  fallback_to_static_bank: true

  # How long (milliseconds) /current-task waits for an in-flight prefetch
  # job to finish before falling further down the ladder (static bank,
  # then template-only). Sensible range: 200-3000; should be well under
  # latency_budget.task_render_p95_ms.
  max_wait_ms: 1200

  # The LONGER wait used only when the alternative is inline generation --
  # i.e. when no fallback rung can serve this session's language and the
  # request would otherwise regenerate, from scratch and in the request
  # thread, the exact turn a worker is already most of the way through.
  # Waiting for the in-flight copy is strictly faster than racing it.
  # Only ever applied while a worker is actually consuming the queue.
  # Sensible range: 0-120000; 0 restores the pre-Phase-21 behaviour.
  inline_wait_ms: 45000

  # When live generation is not ready in time, should the participant WAIT
  # for a turn built from their own code, or be served a generic stand-in
  # exercise immediately?
  #
  # true (default) is Phase 21's decision, taken after a real Python pull
  # request served all eight round-1 turns as `static_bank_a1.py`
  # stand-ins: "a comprehension gate that never asks about the change it
  # is gating is not doing its job". It was hardcoded as a literal
  # `if True:` in dev_gate.py until Phase 24 made it this knob.
  #
  # false restores Phase 6's latency-first behaviour (degrade to the
  # fallback ladder as soon as max_wait_ms expires). The ladder's own
  # tests set false to exercise the lower rungs.
  #
  # Cheaper to leave true than it was: turn generation measured ~1.4s
  # after Phase 24, against the 50s that motivated the original doubt.
  prefer_real_turn_over_substitute: true

  # How many of the pull request's OWN functions a single turn may try
  # before giving up and letting the fallback ladder serve a stand-in.
  #
  # Some functions genuinely cannot host some bug classes -- a handler
  # that returns a constant dict has no boundary to shift, so an A1
  # (off-by-one) perturbation of it is an impossible request, and the
  # model answers impossible requests by mangling syntax. Observed on a
  # real participant's `home()`: A1 failed five times running while
  # A2/A3/A4 succeeded on the same function in ~2s each.
  #
  # 1 restores the previous behaviour (one function, then a stand-in).
  # Sensible range: 1-4; each extra candidate costs one generation
  # attempt (~2s) only when the previous one could not be perturbed.
  max_functions_tried_per_turn: 3

  # How many times a turn that was served by a FALLBACK rung (static bank
  # or template-only) may be discarded and regenerated from the
  # participant's own code on a later /current-task.
  #
  # Without this the ladder never reconsidered a turn it had already
  # answered: one transient generation failure persisted a stand-in
  # exercise under that turn's key, every later request hit the `cache`
  # rung, and the participant was permanently asked about an unrelated
  # Python snippet instead of their own pull request. Reported from real
  # play -- "the template is coming instead of the code".
  #
  # A cap is needed because generation genuinely cannot succeed for some
  # functions; without one, every panel open would pay the full failed
  # attempt again. Only spent while a worker is alive, and never on a turn
  # the participant has already submitted against. Sensible range: 0-5;
  # 0 restores the previous never-reconsider behaviour.
  max_fallback_upgrade_attempts: 2

  # Whether entering a turn also enqueues an AI-opponent "warm-up" call
  # (a cheap/no-op prompt) for the Attack phase, to hide first-call
  # latency. Off by default since it spends an extra LLM call per turn
  # for a latency benefit that's only real on providers with meaningful
  # cold-start cost.
  opponent_warmup_enabled: false

# --- workers: RQ (Redis Queue) job execution policy. ---
workers:
  # Max retries for a background job before it's left in RQ's
  # FailedJobRegistry (the dead-letter mechanism -- verified via RQ's own
  # behavior, not assumed) instead of being retried again.
  # Sensible range: 1-5.
  max_retries: 3

  # Backoff (seconds) before each retry attempt, exponential. Length
  # should be >= max_retries. Sensible range per step: 1-120.
  retry_backoff_sec: [2, 8, 30]

  # How long (seconds) a completed job's result stays readable before RQ
  # expires it. Sensible range: 60-3600.
  result_ttl_sec: 600

  # Max seconds a single job may run before RQ kills it as timed out
  # (prevents one hung generation job from blocking a worker forever).
  # Sensible range: 30-300.
  job_timeout_sec: 120

# --- latency_budget: enforced per-endpoint p95 latency targets (ms).
# Starting values per the phase brief -- to be MEASURED against the demo
# workload (see demo_phase_6.py), not assumed correct. A test fails if the
# demo workload's measured p95 exceeds these. ---
latency_budget:
  task_render_p95_ms: 1500
  defense_verdict_p95_ms: 4000
  attack_opponent_p95_ms: 8000

  # Phase 30 replaced nfr_scoring_p95_ms (6000) with this. The Lead gate's
  # slow step is no longer scoring a written answer -- there is no scorer
  # -- it is GENERATING a question, which costs one generation call plus
  # lead_gate.self_consistency_k cold re-asks, and possibly a whole
  # regeneration round on top. Mapped to GET /lead-gate/<pr>/current-question
  # (app/telemetry/latency.py); POST /answer now needs no budget at all,
  # since grading is an integer comparison against a stored key.
  #
  # 15000 is a REASONED starting point, not a measured one: ~2s/call
  # against this study's local model (measured in Phase 24) x 4 calls,
  # with headroom for one regeneration. It has not been measured against
  # a real model here -- see reports/phase-30-review.md's open questions.
  nfr_question_p95_ms: 15000

# --- extension: the Chrome (MV3) extension's own config. Read at BUILD
# time (extension/vite.config.js parses this file directly), not at
# runtime -- there is no live config-fetch from the extension, since that
# would need its own authenticated endpoint for a chicken-and-egg reason
# (the extension needs a base URL to fetch config from in the first
# place). Changing this requires rebuilding the extension. ---
extension:
  # Base URL the extension's service worker calls for all backend
  # requests. This is the ONE place the backend's port is defined --
  # backend/scripts/run_dev_server.py and e2e_server.py both parse the
  # port back out of this URL, and extension/scripts/build.js inlines it
  # (and derives manifest.json's host_permissions from it) at build time.
  # Changing it therefore needs an extension REBUILD + reload, and a
  # restart of whichever dev server is running.
  #
  # As of 2026-08-21 this is a PUBLIC ngrok tunnel, not localhost: the
  # researcher drives Chrome from a separate Windows desktop while the
  # backend runs on the Linux box (studyhost, 10.0.0.10), so
  # "localhost" meant two different machines and the extension had
  # nothing to talk to without an SSH port-forward. The tunnel fronts
  # that same host's port 5055.
  #
  # The URL carries NO port, and that is deliberate: run_dev_server.py
  # and e2e_server.py parse the port back out of it and fall back to
  # 5055 when there is none, which is exactly the local port the tunnel
  # forwards to. Keep it that way, or those servers will bind to
  # whatever port is written here and the tunnel will point at nothing.
  #
  # Port 5055, not Flask's own default 5000: on the study's Linux box
  # an unrelated `python app.py` from another project already holds
  # 0.0.0.0:5000, so binding there fails or -- worse -- the extension
  # silently talks to that other service.
  #
  # An ngrok free tunnel serves an HTML interstitial (ERR_NGROK_6024) to
  # anything with a browser User-Agent, which every extension fetch has.
  # extension/src/shared/api.js therefore sends the documented
  # `ngrok-skip-browser-warning` header on every BACKEND request --
  # without it each call returns that page with HTTP 200 and the
  # extension sees an empty body rather than an error.
  backend_base_url: "https://your-backend.example.com"

# --- github_app: the GitHub App integration (Phase 10) -- everything
# secret (app ID, private key, webhook secret) lives in environment
# variables, never here, since this file is committed to the repo. See
# docs/GITHUB-APP-SETUP.md. ---
github_app:
  # Lifetime (seconds) of the App-level JWT used to authenticate as the
  # App itself (before exchanging for an installation token). GitHub
  # hard-caps this at 600s; kept a little under to avoid a request
  # landing right at the edge of validity. Sensible range: 60-570.
  app_jwt_expiry_sec: 540

  # How long (seconds) before an installation access token's real expiry
  # (GitHub issues these valid for ~1 hour) the cached copy is treated as
  # stale and refreshed, so a request never races the actual expiry.
  # Sensible range: 30-300.
  installation_token_refresh_buffer_sec: 120

  # Base URL for GitHub's REST API. Overridable so tests point this at a
  # mock server instead of the real api.github.com (this project has no
  # live GitHub App registered -- see reports/phase-10-review.md open
  # questions).
  api_base_url: "https://api.github.com"

  # Check run context names shown in GitHub's UI. Two separate check
  # runs, not one, so the Developer's own comprehension gate and the
  # Lead's NFR review gate can each independently block merge -- see
  # reports/phase-10-review.md for why this reads "one check run per
  # persona" rather than a single combined check.
  check_name_developer: "aicodequest/comprehension-gate (developer)"
  check_name_lead: "aicodequest/comprehension-gate (lead)"

  # Base template for a check run's details_url -- the Chrome extension
  # has no standalone web page of its own (Phase 9's game panel only
  # exists injected inside a real GitHub PR page), so this just deep-
  # links back to the PR itself; the participant clicks the extension's
  # red icon there, same as arriving directly. {owner}/{repo}/{pr_number}
  # are substituted at request time.
  details_url_template: "https://github.com/{owner}/{repo}/pull/{pr_number}"

# --- enforcement: the between-subjects study condition controlling what
# a comprehension-gate check run actually does. Recorded per PR in
# telemetry regardless of mode (see app/services/github_app.py) -- results
# cannot be pooled across modes without knowing which one applied. ---
enforcement:
  # Default mode for repos with no explicit per-repo override
  # (RepoDocument.enforcement_mode -- see app/services/github_app.py's
  # resolve_enforcement_mode()). "shadow" is the safe recruitment
  # default: it never blocks anything, regardless of the underlying gate
  # state.
  #   shadow   - the check run always reports neutral/success; nothing
  #              is ever blocked. Recruitment fallback for orgs that
  #              will not enable branch protection.
  #   advisory - the check run reflects the TRUE gate state, but is not
  #              configured as a required status check; merge stays
  #              possible regardless, the red state is just visible.
  #   enforced - identical reporting to advisory from this app's own
  #              code -- the difference is entirely an ORG-side branch-
  #              protection setting (see docs/BRANCH-PROTECTION-SETUP.md)
  #              this app cannot configure or verify itself (no
  #              Administration permission was requested -- see
  #              docs/GITHUB-APP-SETUP.md). Only a correctly-configured
  #              "enforced" repo actually blocks a merge.
  mode: shadow

# --- leaderboard: aggregate maintenance (Phase 11). PUBLIC metrics are
# deliberately coarse (total cleared, a banded tier, badges, a streak) --
# never a raw score or anything level/type-specific that would let a
# participant reverse-engineer which perturbation types the AI opponent
# fails to fix. See app/services/leaderboard.py and
# reports/phase-11-review.md. ---
leaderboard:
  # How the developer board's ranked score is composed. Set to a 50/50 blend
  # of the two graded phases on 2026-09-25 at the study lead's direction, for
  # one stated reason: **so that participants play the Attack phase instead
  # of skipping it.** A skipped Attack turn produces no datum at all, and the
  # study needs those turns played.
  #
  # THIS IS NOT THE GATE SCORE. The merge button is released on bug
  # detection accuracy alone (developer_gate.pass_threshold_pct), so no
  # amount of skipping can ever block somebody from raising a pull request.
  # The blend costs RANK, never ACCESS. That separation is the whole design:
  # pressure belongs on the leaderboard, not on someone's own work.
  #
  # A weighted mean of the two phase RATES, not a pooled count of won turns.
  # The two coincide only when both phases have the same number of graded
  # turns, which a single skipped Attack turn breaks. Weights need not sum
  # to 1 (they are normalised over the contributing phases) but must sum to
  # more than 0 -- backend/app/services/scoring.py raises rather than
  # ranking everyone at 0.
  score_weights:
    defense: 0.5
    attack: 0.5

  # What happens to a phase with NO graded turns. **This is the setting that
  # makes the incentive above work or backfire, so read the numbers before
  # changing it.** For a developer with a 72% defense rate:
  #
  #                           renormalize      zero
  #   skips all attack           72%            36%
  #   plays attack, wins 40%     56%            56%
  #   plays attack, wins 0%      36%            36%
  #
  #   zero         an absent phase contributes 0 at its full weight. Playing
  #                Attack is then always at least as good as skipping, and
  #                strictly better the moment one Attack turn is won. This
  #                is the default, and the only value that produces the
  #                behaviour the blend was asked for.
  #
  #   renormalize  weight only the phases that have graded turns. This
  #                INVERTS the incentive: skipping (72%) beats playing
  #                attack well (56%), because a mediocre attack rate drags
  #                the mean down while skipping leaves the defense rate
  #                untouched. It teaches participants that the way to
  #                protect their rank is to skip. Kept only so the
  #                trade-off is switchable and written down rather than
  #                rediscovered.
  #
  # `zero` is safe precisely BECAUSE the gate does not read this number.
  #
  # Known edge, accepted: a participant who has not REACHED the Attack phase
  # yet (mid-round, or abandoned after Defense) is indistinguishable from one
  # who skipped it -- both have zero graded Attack turns -- so both score
  # half. It resolves as soon as they play, and it is the intended pressure.
  score_absent_phase: zero

  # Volume adjustment for the ranked score (2026-10-03, at the study lead's
  # request: "consider the number of times they played also"). Each phase's
  # rate becomes won / (graded + K) before the blend above, i.e. every
  # participant starts with K pretend-MISSED turns per phase.
  #
  #                     Defense   Attack    K=0      K=4
  #   one lucky turn     1/1       1/1     100%      20%
  #   long, good         30/40     12/40   52.5%    47.7%
  #   short, skipped     6/8       --      37.5%    25.0%
  #
  # A short record is pulled down hard and the pull fades as the record
  # grows, so the score converges to the true rate -- volume counts, but a
  # lost turn still lowers the score, so it is not a grind. Pulled toward 0,
  # never toward 50% or the mean: any higher anchor lets one lucky turn
  # outrank a long good record, which is what this exists to stop.
  # 4 = one round's worth of Defense turns. 0 = the plain rate.
  # RANKING ONLY: the gate never reads this (see scoring.py).
  score_confidence_turns: 4

  # Tier thresholds (ascending) on the RATE-LIMITED public
  # total_gates_cleared count -- a banded rank, never the raw number of
  # underlying attempts/turns. The highest threshold met is the tier.
  # Sensible range per step: enough separation that tiers feel earned.
  tiers:
    - name: newcomer
      min_gates_cleared: 0
    - name: bronze
      min_gates_cleared: 1
    - name: silver
      min_gates_cleared: 5
    - name: gold
      min_gates_cleared: 15
    - name: platinum
      min_gates_cleared: 30

  # Anti-gaming: at most this many gate completions per user count toward
  # PUBLIC standings (total_gates_cleared/tier/badges/streak) within a
  # rolling window of rate_limit_window_hours -- excess completions in a
  # window still count in the PRIVATE/researcher view (nothing is hidden
  # from the researcher), just not toward the public leaderboard. Guards
  # against a caller-supplied-pr_id gaming vector (no real PR-ingestion
  # pipeline exists yet -- see Phase 5/7's open questions -- so nothing
  # stops a user from calling /dev-gate/{fabricated-pr-id}/start
  # repeatedly). Sensible range: 5-50.
  max_completions_per_window: 20

  # Rolling window (hours) the above cap applies over. Sensible range:
  # 1-168 (1 hour - 1 week).
  rate_limit_window_hours: 24

  # How much a stored aggregate's numeric public/private metric may
  # differ from a from-scratch recomputation before the nightly
  # reconciliation job (backend/scripts/reconcile_leaderboard.py) logs it
  # as drift rather than treating it as harmless float rounding. Sensible
  # range: 0.0-1.0.
  reconciliation_drift_tolerance: 0.01

# --- badges: config-driven so a new badge never needs a code change.
# Each entry's `metric` must be a key produced by
# app/services/leaderboard.py's compute_raw_metrics() (the SAME rate-
# limited/exclusion-applied metrics used for public display -- a gamed or
# excluded completion can't earn a badge either). `op` is one of
# >=, >, <=, <, ==, != (app/services/leaderboard.py's small, safe
# evaluator -- deliberately not a general expression language/eval()). ---
badges:
  - id: first_clear
    name: "First Clear"
    tier: bronze
    metric: total_gates_cleared
    op: ">="
    value: 1
    persona: any
  - id: cleared_a1
    name: "Cleared at A1"
    tier: bronze
    metric: won_defense_turns_a1
    op: ">="
    value: 1
    persona: developer
  - id: cleared_a2
    name: "Cleared at A2"
    tier: bronze
    metric: won_defense_turns_a2
    op: ">="
    value: 1
    persona: developer
  - id: cleared_a3
    name: "Cleared at A3"
    tier: silver
    metric: won_defense_turns_a3
    op: ">="
    value: 1
    persona: developer
  - id: cleared_a4
    name: "Cleared at A4"
    tier: gold
    metric: won_defense_turns_a4
    op: ">="
    value: 1
    persona: developer
  - id: no_scaffold_clear
    name: "No-Scaffold Clear"
    tier: gold
    metric: no_scaffold_clears
    op: ">="
    value: 1
    persona: developer
  - id: lead_gate_clear
    name: "Lead Gate Clear"
    tier: bronze
    metric: lead_gates_cleared
    op: ">="
    value: 1
    persona: lead
  # Phase 37: repointed from `current_streak` (consecutive gate CLEARS) to
  # the consecutive-DAY streak. The old metric could not move on real data
  # -- clears are rare, so "Consistency Streak" sat unreachable for
  # everyone -- and a day streak is what the badge's own name describes.
  - id: consistency_streak_3
    name: "Three-Day Streak"
    tier: bronze
    metric: current_day_streak
    op: ">="
    value: 3
    persona: any
  - id: consistency_streak_7
    name: "Week-Long Streak"
    tier: silver
    metric: current_day_streak
    op: ">="
    value: 7
    persona: any
  # --- Phase 29: badges that reward PLAYING, not only finishing.
  #
  # The eight above are almost all "did you clear a gate", so a
  # participant with 130 graded turns on one pull request had earned five
  # of them within their first clear and could earn nothing else no matter
  # how much they played -- asked for as "make the badges more
  # interesting". These are tiered, so there is always a next one, and
  # they key off the turn-level metrics added in the same phase.
  #
  # Deliberately no badge for replays, restarts or time taken: those are
  # struggle, and a badge is a public artefact (see
  # FORBIDDEN_PUBLIC_KEYS). ---
  - id: turns_10
    name: "Getting Started"
    tier: bronze
    metric: turns_played
    op: ">="
    value: 10
    persona: developer
  - id: turns_50
    name: "Regular"
    tier: silver
    metric: turns_played
    op: ">="
    value: 50
    persona: developer
  - id: turns_150
    name: "Veteran"
    tier: gold
    metric: turns_played
    op: ">="
    value: 150
    persona: developer
  - id: win_streak_3
    name: "On a Roll"
    tier: bronze
    metric: longest_turn_streak
    op: ">="
    value: 3
    persona: developer
  - id: win_streak_5
    name: "Hot Streak"
    tier: silver
    metric: longest_turn_streak
    op: ">="
    value: 5
    persona: developer
  - id: win_streak_10
    name: "Unstoppable"
    tier: gold
    metric: longest_turn_streak
    op: ">="
    value: 10
    persona: developer
  - id: sharp_eye
    name: "Sharp Eye"
    tier: silver
    metric: bug_detection_accuracy
    op: ">="
    value: 0.6
    persona: developer
  - id: eagle_eye
    name: "Eagle Eye"
    tier: gold
    metric: bug_detection_accuracy
    op: ">="
    value: 0.8
    persona: developer
  - id: trickster
    name: "Trickster"
    tier: silver
    metric: bug_injection_success_rate
    op: ">="
    value: 0.4
    persona: developer
  - id: mastermind
    name: "Mastermind"
    tier: gold
    metric: bug_injection_success_rate
    op: ">="
    value: 0.7
    persona: developer
  - id: all_levels
    name: "Full Spectrum"
    tier: gold
    metric: levels_won
    op: ">="
    value: 4
    persona: developer

  # --- Phase 37: the LEAD's reviewer ladder. -------------------------
  # `mcq_reviews_completed` counts ANSWERED comprehension reviews. It
  # counted RATED, non-skipped ones until 2026-08-31, when the rating step
  # was removed -- a review is now finished when the lead's cold answer is
  # in, because that answer IS the review. Left on `rated_at`, every badge
  # here would have frozen on that date.
  #
  # Deliberately NOT `lead_verifications_given`, which counted NFR
  # verifications inside the lead's own gate: a different contribution, and
  # one that has also stopped growing.
  #
  # Three rungs so there is always a next target for a reviewer who has
  # just earned one, which is the same reason the developer ladder is
  # tiered rather than a single award.
  - id: reviewer_5
    name: "First Reviews"
    tier: bronze
    metric: mcq_reviews_completed
    op: ">="
    value: 5
    persona: lead
  - id: reviewer_10
    name: "Steady Reviewer"
    tier: silver
    metric: mcq_reviews_completed
    op: ">="
    value: 10
    persona: lead
  - id: reviewer_50
    name: "Review Veteran"
    tier: gold
    metric: mcq_reviews_completed
    op: ">="
    value: 50
    persona: lead

  # --- Phase 42: the BUG-CATCHING ladder, on `bugs_found` --------------
  #
  # `bugs_found` is the number of Defense turns this participant has WON,
  # across every pull request. Deliberately NOT `won_defense_turns_a*`,
  # which every other developer badge here uses: those are scoped to
  # publicly-eligible CLEARED gates, and on real data almost nobody has
  # cleared one -- the pass threshold is 60% and real bug-detection
  # accuracy runs at ~17%. Measured on the live database before choosing:
  # a participant with 5 won turns scores 0 on the scoped counter, and one
  # with 19 scores 5. A ladder keyed on the scoped count would therefore
  # sit unearned for people who are visibly playing, which is the exact
  # complaint Phase 29 and Phase 37 part 3 were both raised over.
  #
  # THE TIERS CARRY THE COLOUR, and the ladder deliberately runs past gold
  # into platinum and legend so a long run keeps producing a visibly
  # different reward rather than a third gold.
  #
  # The ladder stops at 100. Beyond it, every further multiple of
  # `gamification.milestone_every` still celebrates (confetti + a count
  # toast) without minting a badge -- see the gamification section. A
  # config table cannot hold an unbounded ladder, and a badges page of
  # forty near-identical cards is not a reward.
  - id: first_bug
    name: "First Bug Caught"
    tier: bronze
    metric: bugs_found
    op: ">="
    value: 1
    persona: developer
  - id: bugs_10
    name: "Bug Hunter"
    tier: bronze
    metric: bugs_found
    op: ">="
    value: 10
    persona: developer
  - id: bugs_20
    name: "Bug Tracker"
    tier: silver
    metric: bugs_found
    op: ">="
    value: 20
    persona: developer
  - id: bugs_30
    name: "Bug Slayer"
    tier: gold
    metric: bugs_found
    op: ">="
    value: 30
    persona: developer
  - id: bugs_40
    name: "Skilled Contributor"
    tier: platinum
    metric: bugs_found
    op: ">="
    value: 40
    persona: developer
  - id: bugs_50
    name: "Code Champion"
    tier: legend
    metric: bugs_found
    op: ">="
    value: 50
    persona: developer
  - id: bugs_100
    name: "Bug Legend"
    tier: legend
    metric: bugs_found
    op: ">="
    value: 100
    persona: developer

# --- gamification: the in-turn celebration (Phase 42). ------------------
#
# The BADGES table above decides what exists and what it is called; this
# section decides when a celebration FIRES and how long it is on screen.
# The two are separate on purpose: adding a badge must not change pacing,
# and retuning pacing must not silently mint or retire an award.
gamification:
  # Celebrate at every Nth bug caught. The badge ladder covers 1, 10, 20,
  # 30, 40, 50 and 100; every OTHER multiple of this number (60, 70, ...)
  # still gets a toast and confetti, with no badge attached, so a long run
  # keeps paying out after the ladder is exhausted.
  #
  # 0 disables count milestones entirely, leaving only the badges.
  milestone_every: 10

  # Celebrate the very first bug caught, which is not a multiple of
  # `milestone_every` and would otherwise be silent. This is a
  # participant's first evidence that the game rewards anything at all,
  # and it is the one moment where that matters most.
  celebrate_first_bug: true

  # Celebrate EVERY bug caught, not only the ladder rungs.
  #
  # Set true on 2026-09-09 at the study lead's direction -- "every time you
  # solve give the badges ... they will hit a dopamine and get playing the
  # game" -- and it REVERSES Phase 42's deliberate silence on ordinary
  # wins. The measured reason it was wrong: a participant reported catching
  # two bugs with no celebration, and the database agreed with them. Those
  # were wins #14 and #15; their `first_bug` and `bugs_10` were both
  # crossed on 2026-08-29, before any of this existed, so the ladder was
  # correct and they had simply already walked past every rung it had.
  #
  # THE ORIGINAL OBJECTION STILL STANDS AND IS ANSWERED BY INTENSITY, NOT
  # BY SILENCE. A reward that fires identically on every win stops reading
  # as a reward, so an ordinary win gets a SMALL toast (the running count,
  # no confetti) while a ladder rung keeps the badge AND the confetti. The
  # participant is told something every time; the rungs still feel bigger.
  #
  # false restores Phase 42's behaviour exactly.
  celebrate_every_win: true

  # Confetti when a ROUND finishes, whatever the score.
  #
  # "after completing one phase show them confetti for completion [lose or
  # win doesn't matter], it's for completing the game" -- the reward is for
  # FINISHING, which is the behaviour the study needs and the one a
  # participant controls. Winning is not, at a ~17% real detection rate
  # against a 60% threshold; celebrating only a clear would mean almost
  # nobody ever sees it.
  confetti_on_round_complete: true

  # How long a celebration toast stays on screen, in milliseconds, before
  # the game continues on its own. Deliberately SHORT and deliberately
  # self-dismissing: a modal that interrupts a turn to be clicked away is
  # a tax dressed as a reward.
  toast_ms: 2000

  # Confetti on a milestone. Independent of the toast because it is the
  # half that some participants will find distracting, and because
  # `prefers-reduced-motion` already suppresses the animation at the
  # browser level -- this is the study-level switch, not the accessibility
  # one.
  confetti_enabled: true

# Phase 12: IP minimisation. When false, app/services/minimization.py
# replaces raw source (PerturbationDocument.original_code/perturbed_code/
# ground_truth_patch, DevGateSessionDocument.function_source,
# LeadGateSessionDocument.diff_text) with normalised AST fingerprints /
# content hashes once a session reaches a terminal state -- see
# reports/phase-12-review.md for why this can't happen at write time
# (live turns need real, runnable code) and open questions.
data:
  retain_source_snippets: true
  redaction:
    # Applied unconditionally to every outbound LLM prompt (app/services/
    # llm.py's LLMClient._call), independent of retain_source_snippets --
    # this governs what a third-party LLM provider ever sees over the
    # wire, not Mongo persistence. See docs/DATA-FLOW.md.
    enabled: true
    # JIRA-style ticket ID convention (e.g. "PROJ-123") -- configurable
    # since this varies by org/tracker; emails and URLs use fixed regexes
    # in app/services/redaction.py since those formats don't vary.
    ticket_id_pattern: "[A-Z][A-Z0-9]{1,9}-[0-9]{1,6}"

# Phase 12: two-tier consent gates (app/services/consent.py).
consent:
  # Stamped on newly-signed participant consent records; a submission
  # naming a different version is rejected so participants are always
  # re-consenting to the CURRENT text, not silently grandfathered in.
  current_version: "v1"
  withdrawal_categories:
    - code_snippets
    - transcripts
    - quotes_in_publication

  # --- how strictly ORGANISATION consent is enforced (Phase 36) ---
  #
  # Organisation consent is a per-repository-OWNER record asserting that
  # the organisation agreed the study may run on its code. It is a
  # different thing from PARTICIPANT consent (signed by a person, in the
  # popup, covering what we keep about them), and no amount of the latter
  # satisfies the former -- a confusion that has now cost real testing time
  # three times, because a participant who signs consent and is then
  # refused has no way to tell the two apart.
  #
  #   required  -- refuse (403 org_consent_missing) for any owner with no
  #                record. This is what docs/DATA-FLOW.md and the study
  #                protocol currently PROMISE, and it is the right setting
  #                once real participants bring real repositories.
  #   advisory  -- proceed anyway, but RECORD that no consent was on file
  #                (an `org_consent_absent` event, and
  #                `org_consent_present: false` on the gate evaluation).
  #                For development and for pilots on researcher-owned
  #                repositories, where the blocking check is pure friction.
  #
  # There is deliberately no "off": advisory still records the absence, so
  # an analysis can always separate sessions that ran with consent on file
  # from sessions that did not. Silently not knowing is the one option that
  # is never acceptable -- the same rule Phase 33 applied to an unknown
  # grading regime.
  #
  # NOTE the alternative to advisory mode, which is often the better
  # answer: register a WILDCARD record (`--org '*'`) via
  # backend/scripts/register_org_consent.py. That keeps this at `required`
  # and states the blanket agreement as an explicit governance record with
  # its own agreement reference, rather than turning the check down.
  org_consent_mode: advisory

# Phase 12: study-mode toggles (app/services/dev_gate.py / lead_gate.py
# start_gate()'s `is_practice` flag; app/services/research_dashboard.py;
# backend/scripts/export_study_data.py excludes is_practice sessions).
study:
  practice_mode_enabled: true

# Phase 13: alerting thresholds for backend/scripts/check_alerts.py
# (queue depth + p95 latency vs. latency_budget, cron-able during the
# study). The webhook URL itself is an env var
# (AICODEQUEST_ALERT_WEBHOOK_URL), not committed here, same secret-
# handling pattern as JWT_SECRET_KEY/GITHUB_WEBHOOK_SECRET.
observability:
  queue_depth_alert_threshold: 50
  p95_check_window_minutes: 15

  # Phase 32: alert when executable test suites cover less than this
  # percentage of recent turns whose language is graded BY TESTS.
  # Suites are generated only on the prefetch path, so with the RQ worker
  # down (or Ollama unreachable, or a stale config cache -- all three have
  # happened) every turn silently degrades to comparison grading and
  # nothing said so. Set to 0 to disable. Sensible range: 40-80 -- the
  # measured per-language acceptance is 58-100%, so a threshold near 100
  # would alert constantly.
  suite_coverage_alert_pct: 50

  # Do not alert on suite coverage until this many graded-by-tests turns
  # have been served in the window: 0 of 1 is noise, 0 of 20 is an outage.
  # Sensible range: 5-30.
  suite_coverage_min_sample: 10

  # Turn the backend's own loggers up to DEBUG: full LLM prompts and
  # responses, per-stage function entry/exit with timings, and the
  # per-request werkzeug line demoted OUT of the way (the panel polls
  # /progress about once a second, and those lines otherwise bury
  # everything this exists to show).
  #
  # Costs nothing when off -- every DEBUG site checks isEnabledFor first.
  # Overridable per process with AICQ_VERBOSE=1 / =0 without editing
  # config, which is what you want when a participant is mid-session.
  verbose_logging: false

  # Colour backend logs by SUBSYSTEM (dev_gate, perturbation, llm,
  # suitegen, grading each get their own), not only by level. Automatically
  # disabled when stderr is not a TTY, when NO_COLOR is set, or under
  # TERM=dumb, so a log file never fills with escape codes.
  color_logs: true

  # How many characters of an LLM prompt/response the DEBUG view shows,
  # truncated in the MIDDLE (a prompt's tail carries the function under
  # test and the retry feedback, which is usually the part being
  # debugged). 0 = no truncation.
  log_payload_chars: 4000

# --- bug_bank: the A1-A4 mutation-operator catalogue (Phase 28).
#
# WHY THIS EXISTS. Until now each level was one loose sentence in a prompt
# ("a semantic bug (e.g. a flipped operator, an inverted condition...)"),
# and the model chose what that meant. Two failures were reported from real
# play, and both trace to that vagueness:
#
#   * an A1 turn served a bug that had DELETED a dict field -- an A3 in this
#     taxonomy. Levels are the study's independent variable, so a
#     mislabelled turn corrupts the measure, not just the reading
#     experience.
#   * "sometimes there is no bug at all" -- asked for something subtle with
#     no concrete target, the model sometimes produced a rename or a
#     reordering, which changes nothing.
#
# Naming ONE concrete operator per turn, with a worked example, removes
# both degrees of freedom. It also gives the study a finer measure than
# per-level accuracy: every attempt records the operator it used, so
# "which KIND of bug gets past people" becomes answerable.
#
# Structure per operator (same catalogue-in-config pattern as `badges`,
# so adding one needs no code change):
#   id           stable key; recorded in telemetry and on the perturbation
#   name         short human label, shown in the researcher dashboard
#   instruction  what the model is told to do, imperative and specific
#   before/after a minimal worked example of the edit
#
# The levels, stated as the question each one asks the participant:
#   A1  "can you see that something is structurally wrong?"
#   A2  "can you understand what this code is supposed to MEAN?"
#   A3  "can you tell whether the ALGORITHM is actually correct?"
#   A4  "can you recognise something that looks like legitimate
#        AI-generated code but is fabricated?"
bug_bank:
  A1:
    - id: off_by_one_bound
      name: "Off-by-one loop bound"
      instruction: "Shift a loop bound by one so it runs one iteration too many or too few"
      before: "for (int i = 0; i < n; i++)"
      after: "for (int i = 0; i <= n; i++)"
    # Moved from A2 (2026-08-30). Its instruction -- "alter a guard's
    # BOUNDARY so singleton or empty inputs take the wrong path" -- is A1's
    # participant briefing almost word for word ("a comparison or index is
    # off by one... the exact value a condition flips on"). Filed under A2
    # it produced A1 bugs under an A2 label on every draw.
    - id: boundary_condition_alteration
      name: "Incorrect conditional boundary"
      instruction: "Alter a guard's boundary so singleton or empty inputs take the wrong path"
      before: "if (len > 1)"
      after: "if (len >= 1)"
    - id: missing_return
      name: "Missing return"
      instruction: "Remove a return statement so the function no longer returns its result"
      before: "return max;"
      after: ""
    - id: wrong_initialization
      name: "Wrong initialization"
      instruction: "Initialise an accumulator to a value that breaks a legitimate input class"
      before: "int max = arr[0];"
      after: "int max = 0;"
    - id: missing_statement
      name: "Missing statement"
      instruction: "Delete one necessary statement inside a loop or branch"
      before: "i++;"
      after: ""
    - id: wrong_loop_boundary
      name: "Wrong loop boundary"
      instruction: "Change a loop's end boundary so the last element is skipped or overrun"
      before: "i < n"
      after: "i < n - 1"
    - id: wrong_starting_index
      name: "Wrong starting index"
      instruction: "Start a loop at the wrong index so the first element is ignored"
      before: "for (int i = 0; i < n; i++)"
      after: "for (int i = 1; i < n; i++)"
    - id: wrong_counter_init
      name: "Incorrect counter initialisation"
      instruction: "Initialise a counter to the wrong starting value"
      before: "count = 0"
      after: "count = 1"
    - id: uninitialised_accumulator
      name: "Missing initialisation before use"
      instruction: "Use a variable or collection before giving it its initial value"
      before: "total = 0\n    for x in items: total += x"
      after: "for x in items: total += x"
    - id: wrong_increment
      name: "Wrong increment/decrement"
      instruction: "Reverse the direction of a loop counter's update"
      before: "i++"
      after: "i--"
    - id: missing_break
      name: "Missing break/continue"
      instruction: "Remove a break or continue so control flow falls through"
      before: "if (found) break;"
      after: "if (found) ;"
  A2:
    # Re-instructed and re-exampled 2026-08-30. It previously said "fails
    # only at the BOUNDARY" and showed `x >= target` -> `x > target`, which
    # is a pure strictness change -- an off-by-one, and A1's concept, not
    # A2's. A2's own briefing is "an operator, condition, or pair of values
    # has been FLIPPED", so the example now flips direction, which no A1
    # operator does.
    - id: comparison_replacement
      name: "Wrong comparison operator"
      instruction: "Replace a comparison with one facing the opposite direction, so the branch is taken for the wrong inputs"
      before: "if score > threshold"
      after: "if score < threshold"
    - id: condition_reversal
      name: "Reversed condition"
      instruction: "Invert a condition so the branch fires in exactly the wrong cases"
      before: "if (x > t)"
      after: "if (x < t)"
    - id: arithmetic_replacement
      name: "Wrong arithmetic operator"
      instruction: "Replace an arithmetic operator so the computation drifts"
      before: "sum += arr[i]"
      after: "sum -= arr[i]"
    - id: boolean_operator_replacement
      name: "Wrong boolean operator"
      instruction: "Swap a logical AND for OR (or vice versa) in a compound condition"
      before: "x > 0 && y > 0"
      after: "x > 0 || y > 0"
    - id: assignment_replacement
      name: "Wrong assignment/update"
      instruction: "Change an update so the value moves in the wrong direction"
      before: "count++"
      after: "count--"
    - id: wrong_variable_reference
      name: "Wrong variable used"
      instruction: "Reference a different but plausible in-scope variable"
      before: "total += price"
      after: "total += quantity"
    - id: wrong_update_rule
      name: "Incorrect update rule"
      instruction: "Update state with the wrong expression, keeping the shape identical"
      before: "avg = total / count"
      after: "avg = total / (count + 1)"
    - id: wrong_return_expression
      name: "Wrong return value"
      instruction: "Return a different in-scope value that has the right type but wrong meaning"
      before: "return count;"
      after: "return i;"
    - id: operand_swap
      name: "Operand swap"
      instruction: "Swap the operands of a non-commutative operation"
      before: "return a - b;"
      after: "return b - a;"
  A3:
    - id: missing_edge_case
      name: "Missing edge case"
      instruction: "Remove the guard that handles the empty or missing input case"
      before: "if not items: return 0"
      after: ""
    - id: invalid_precondition
      name: "Invalid precondition"
      instruction: "Violate an algorithm's stated precondition while leaving the code plausible"
      before: "sort(arr); binary_search(arr, target)"
      after: "binary_search(arr, target)"
    - id: wrong_algorithm_variant
      name: "Wrong algorithm variant"
      instruction: "Replace the algorithm with a variant that is correct only under narrower assumptions"
      before: "compare every pair for duplicates"
      after: "compare only adjacent elements for duplicates"
    # Moved from A4 (2026-08-30). A4 is hallucinated INTERFACES ("a
    # fabricated API... a call that doesn't do what its name suggests");
    # getting a real algorithm subtly wrong is A3's territory, next to
    # wrong_algorithm_variant. Its example was also replaced: the old one
    # was a loop-bound rewrite, so the few-shot was teaching the model to
    # produce an A1 no matter which level had asked.
    - id: misremembered_algorithm
      name: "Misremembered algorithm"
      instruction: "Implement a well-known algorithm with a step in the wrong order or omitted, so it is correct only on some inputs"
      before: "mark visited BEFORE pushing the neighbour"
      after: "mark visited AFTER popping it"
    - id: missing_duplicate_handling
      name: "Duplicate handling error"
      instruction: "Handle only adjacent or first-seen duplicates rather than all of them"
      before: "seen = set(); if x in seen: continue"
      after: "if x == previous: continue"
    - id: wrong_recursion_base_case
      name: "Incorrect recursion base case"
      instruction: "Narrow the recursion base case so a valid input never reaches it and recurses past the bottom"
      # Re-exampled 2026-08-30. The old example (`n <= 1` -> `n == 0`) is a
      # comparison swap, which is A2's shape, so the few-shot pulled the
      # model toward A2 while the turn was labelled A3.
      before: "if not nodes: return []"
      after: "if nodes is None: return []"
    - id: invariant_violation
      name: "Invariant violation"
      instruction: "Break a data structure's core invariant while keeping the operations plausible"
      before: "stack.pop()  # LIFO"
      after: "stack.pop(0)  # FIFO"
    - id: incorrect_state_transition
      name: "Incorrect state transition"
      instruction: "Update accumulated state from the wrong prior state"
      before: "dp[i] = dp[i-1] + dp[i-2]"
      after: "dp[i] = dp[i-1] + 1"
    - id: greedy_where_invalid
      name: "Greedy choice where invalid"
      instruction: "Take a locally optimal choice in a problem that needs a global one"
      before: "consider all combinations"
      after: "always take the largest remaining item"
    - id: wrong_data_structure
      name: "Incorrect data-structure choice"
      instruction: "Use a structure whose semantics silently change the result (e.g. list for set)"
      before: "seen = set()"
      after: "seen = []"
    - id: incomplete_algorithm_step
      name: "Incomplete algorithm step"
      instruction: "Drop one required step of a multi-step algorithm"
      before: "normalise(); score(); rank()"
      after: "score(); rank()"
  A4:
    - id: fake_api
      name: "Non-existent API"
      instruction: "Call a plausible-sounding method that does not exist on that type"
      before: "sum(arr) / len(arr)"
      after: "arr.findMedian()"
    - id: fake_library_function
      name: "Fabricated library function"
      instruction: "Call a convenience function from a real library that the library does not provide"
      before: "s[::-1]"
      after: "str.reverse(s)"
    - id: wrong_api_signature
      name: "Wrong API signature"
      instruction: "Call a real function with confidently wrong arguments or argument order"
      before: "json.dumps(obj)"
      after: "json.dumps(obj, strict=True)"
    - id: wrong_api_return_type
      name: "Wrong API return type assumption"
      instruction: "Treat a real function's return value as the wrong type"
      before: "int(input_str)"
      after: "input_str.toInt()"
    - id: fabricated_constant
      name: "Confidently fabricated constant"
      instruction: "Reference a constant or macro that looks standard but is not defined anywhere"
      before: "1024"
      after: "MAX_ARRAY_SIZE"
    - id: wrong_header_association
      name: "Wrong library/header association"
      instruction: "Use a function as though it belonged to a different, plausible module"
      before: "math.sqrt(x)"
      after: "string.sqrt(x)"
    - id: index_value_confusion
      name: "Plausible index/value confusion"
      instruction: "Pass an element where an index is expected, or the reverse"
      before: "for i, v in enumerate(a): use(i)"
      after: "for i, v in enumerate(a): use(v)"
    - id: fabricated_convenience_function
      name: "Fabricated convenience function"
      instruction: "Invent a helper abstraction and call it as though it already existed"
      before: "all(is_prime(x) for x in arr)"
      after: "isPrimeArray(arr, n)"
    - id: invalid_idiom
      name: "Plausible but invalid idiom"
      instruction: "Use a fluent-looking idiom that is not valid in this language"
      before: "sorted(items, key=lambda i: i.name)"
      after: "items.sortBy(name)"
